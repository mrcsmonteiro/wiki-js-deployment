---
# Applies the monitoring role, the updated backups role and the updated Wiki.js
# compose file (init: true) to the running host. Later images include all three
# (image.yml).
#
# Nothing is restarted here. After this run, recreate the Wiki.js containers
# once so they pick up init: true:
#   ssh my-ec2 'sudo docker compose -f /opt/wikijs/docker-compose.yml up -d'
# (/opt/wikijs is 0750 root because it holds .env, so cd into it fails as ubuntu.)
#
#   ansible-playbook -i my-ec2, ansible/monitoring.yml
- name: Install the CloudWatch agent, app probe and backup heartbeat
  hosts: all
  become: true
  gather_facts: true

  roles:
    - wikijs
    - backups
    - monitoring
