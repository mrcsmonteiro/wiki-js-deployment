---
# Kept separate from the base role: base upgrades packages and resets Docker,
# so it must never run against a live host. This role is safe on a live host
# (no service restarts).

# Without this, cloud-init sets the hostname back to ip-x-x-x-x at every boot.
- name: Keep the hostname across reboots
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-preserve-hostname.cfg
    mode: "0644"
    content: |
      preserve_hostname: true

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ host_name }}"
    use: systemd

# Lets sudo and other tools resolve the name without DNS.
- name: Map the hostname to loopback
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ host_name }}"
    insertafter: '^127\.0\.0\.1\s'
